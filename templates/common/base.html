<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KM Campus, Banwaripur{% endblock %}</title>
    <style>
        :root { 
            --primary: #2575fc; 
            --secondary: #6a11cb; 
            --success: #27ae60; 
            --danger: #e74c3c; 
            --warning: #f39c12; 
            --dark: #1e3c72;
            --bg-light: #f8fafc;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f0f4f8; color: #333; }
        .alert { padding: 14px 20px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; font-weight: 600; text-align: center; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #fadbd8; color: #721c24; border: 1px solid #f5c6cb; }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
